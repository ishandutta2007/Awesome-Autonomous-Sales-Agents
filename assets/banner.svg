<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { opacity: 0.25; transform: scale(0.95); }
      50% { opacity: 0.55; transform: scale(1.08); }
      100% { opacity: 0.25; transform: scale(0.95); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-18px) translateX(12px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes dashLine {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes barRise {
      0% { height: 18px; y: 352px; }
      50% { height: 42px; y: 328px; }
      100% { height: 18px; y: 352px; }
    }
    .orb-glow {
      transform-origin: center;
      animation: pulseOrb 8s ease-in-out infinite;
    }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 2s; }
    .particle-3 { animation: floatParticle 7s ease-in-out infinite 4s; }
    .data-stream {
      stroke-dasharray: 12, 12;
      animation: dashLine 20s linear infinite;
    }
    .bar-anim-1 { animation: barRise 4s ease-in-out infinite 0.2s; }
    .bar-anim-2 { animation: barRise 4s ease-in-out infinite 1.0s; }
    .bar-anim-3 { animation: barRise 4s ease-in-out infinite 1.8s; }
    .bar-anim-4 { animation: barRise 4s ease-in-out infinite 2.6s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2" />

  <!-- Dynamic Ambient Orbs (Background layer) -->
  <g class="orb-glow">
    <circle cx="200" cy="120" r="160" fill="#38bdf8" opacity="0.18" filter="url(#softGlow)" />
    <circle cx="1020" cy="280" r="180" fill="#818cf8" opacity="0.18" filter="url(#softGlow)" />
    <circle cx="600" cy="380" r="140" fill="#c084fc" opacity="0.15" filter="url(#softGlow)" />
  </g>

  <!-- Tech Grid Background -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="320" y1="0" x2="320" y2="420" />
    <line x1="440" y1="0" x2="440" y2="420" />
    <line x1="560" y1="0" x2="560" y2="420" />
    <line x1="680" y1="0" x2="680" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="920" y1="0" x2="920" y2="420" />
    <line x1="1040" y1="0" x2="1040" y2="420" />
    <line x1="1160" y1="0" x2="1160" y2="420" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Animated Dynamic Data Streams / Flows (Kept in Background / Margins) -->
  <path class="data-stream" d="M -50,60 Q 300,10 600,60 T 1250,50" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.45" />
  <path class="data-stream" d="M -50,380 Q 400,410 750,370 T 1250,390" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.4" />

  <!-- Floating Particles in Margins -->
  <g class="particle-1">
    <circle cx="120" cy="180" r="3" fill="#38bdf8" />
    <circle cx="1120" cy="140" r="4" fill="#818cf8" />
  </g>
  <g class="particle-2">
    <circle cx="160" cy="320" r="3.5" fill="#c084fc" />
    <circle cx="1060" cy="80" r="3" fill="#38bdf8" />
  </g>
  <g class="particle-3">
    <circle cx="980" cy="340" r="4" fill="#34d399" />
    <circle cx="80" cy="80" r="3" fill="#818cf8" />
  </g>

  <!-- Top Pill Badge -->
  <g transform="translate(430, 42)">
    <rect width="340" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" />
    <circle cx="20" cy="17" r="5" fill="#10b981" />
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#93c5fd" letter-spacing="1">⚡ AUTONOMOUS AI SDRs &amp; AGENTS</text>
  </g>

  <!-- FOREGROUND: Header Title & Subtitle (Clear, crisp, strictly foreground) -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Awesome Autonomous Sales Agents
  </text>
  
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="url(#primaryGrad)" letter-spacing="0.5">
    Autonomous Prospecting • AI SDR Workflows • Cold Outreach • Deal Execution
  </text>

  <!-- FOREGROUND: Feature Showcase Pills (Bottom Area) -->
  <!-- Card 1: Enterprise SaaS -->
  <g transform="translate(130, 240)">
    <rect width="210" height="74" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
    <circle cx="36" cy="37" r="16" fill="#0284c7" opacity="0.25" />
    <text x="36" y="42" text-anchor="middle" font-size="16">☁️</text>
    <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Enterprise SaaS</text>
    <text x="66" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Agentforce • 11x • Dynamics</text>
  </g>

  <!-- Card 2: Open-Source AI SDRs -->
  <g transform="translate(365, 240)">
    <rect width="220" height="74" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
    <circle cx="36" cy="37" r="16" fill="#10b981" opacity="0.25" />
    <text x="36" y="42" text-anchor="middle" font-size="16">🔓</text>
    <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Open Source SDRs</text>
    <text x="66" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">SalesGPT • Knotie • Harvey</text>
  </g>

  <!-- Card 3: Multi-Channel Execution -->
  <g transform="translate(610, 240)">
    <rect width="220" height="74" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
    <circle cx="36" cy="37" r="16" fill="#8b5cf6" opacity="0.25" />
    <text x="36" y="42" text-anchor="middle" font-size="16">🎯</text>
    <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Autonomous Cycles</text>
    <text x="66" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Voice • Email • LinkedIn • CRM</text>
  </g>

  <!-- Card 4: Dynamic Metrics & Growth Mini-Graph -->
  <g transform="translate(855, 240)">
    <rect width="215" height="74" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
    <circle cx="36" cy="37" r="16" fill="#f59e0b" opacity="0.25" />
    <text x="36" y="42" text-anchor="middle" font-size="16">📈</text>
    <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">$5.8B+ Market</text>
    <text x="66" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">32%+ CAGR to 2030</text>
  </g>

  <!-- Subtle Dynamic Animated Mini Graph Bars in Footer -->
  <g transform="translate(565, 345)">
    <rect class="bar-anim-1" x="0" y="14" width="8" height="20" rx="3" fill="#38bdf8" opacity="0.75" />
    <rect class="bar-anim-2" x="14" y="8" width="8" height="26" rx="3" fill="#818cf8" opacity="0.75" />
    <rect class="bar-anim-3" x="28" y="2" width="8" height="32" rx="3" fill="#c084fc" opacity="0.75" />
    <rect class="bar-anim-4" x="42" y="10" width="8" height="24" rx="3" fill="#34d399" opacity="0.75" />
    <rect class="bar-anim-1" x="56" y="0" width="8" height="34" rx="3" fill="#38bdf8" opacity="0.8" />
  </g>
</svg>
